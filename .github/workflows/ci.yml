name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Build and unit tests only: the pure Python modules are tested without a simulation.
    # The headless Gazebo end-to-end run (make e2e) needs a GPU and is run locally.
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-xacro python3-opencv python3-pytest python3-yaml python3-numpy
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct-
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --return-code-on-test-failure --event-handlers console_direct-
          colcon test-result --verbose
